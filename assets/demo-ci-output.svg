<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Menlo',monospace">
  <!-- Terminal window -->
  <rect width="900" height="520" rx="10" ry="10" fill="#0d1117"/>
  <!-- Title bar -->
  <rect width="900" height="38" rx="10" ry="10" fill="#161b22"/>
  <rect y="20" width="900" height="18" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="450" y="24" fill="#8b949e" font-size="12" text-anchor="middle" dominant-baseline="middle">regrip ci — behavioral regression gate</text>

  <!-- Content area -->
  <!-- Line 1: command -->
  <text x="20" y="66" fill="#58a6ff" font-size="13">$</text>
  <text x="34" y="66" fill="#c9d1d9" font-size="13"> bash examples/run_demo.sh</text>

  <!-- Section header: Recording -->
  <text x="20" y="92" fill="#3fb950" font-size="12">▶  Recording MCP v1 interactions…</text>
  <text x="20" y="110" fill="#6e7681" font-size="11.5">   Captured 20 envelopes  ·  2 tools  ·  noise masks applied</text>

  <!-- Section header: Baseline -->
  <text x="20" y="134" fill="#3fb950" font-size="12">▶  Building behavioral baseline v1.0.0…</text>
  <text x="20" y="152" fill="#6e7681" font-size="11.5">   Clusters: get_balance(1)  search_products(1)  ·  Masks: uuid, iso8601</text>

  <!-- Section header: Replay -->
  <text x="20" y="176" fill="#3fb950" font-size="12">▶  Replaying against MCP v2 (sandbox: READ_SAFE)…</text>
  <text x="20" y="194" fill="#6e7681" font-size="11.5">   20 replays  ·  0 production writes  ·  egress audited</text>

  <!-- Section header: Diff -->
  <text x="20" y="218" fill="#3fb950" font-size="12">▶  Running 9-category diff engine…</text>

  <!-- Table header -->
  <rect x="20" y="232" width="860" height="22" fill="#161b22" rx="3"/>
  <text x="28" y="247" fill="#8b949e" font-size="11.5" font-weight="bold">Tool</text>
  <text x="175" y="247" fill="#8b949e" font-size="11.5" font-weight="bold">Status</text>
  <text x="258" y="247" fill="#8b949e" font-size="11.5" font-weight="bold">Category</text>
  <text x="390" y="247" fill="#8b949e" font-size="11.5" font-weight="bold">Consumer Impact</text>
  <text x="590" y="247" fill="#8b949e" font-size="11.5" font-weight="bold">Detail</text>

  <!-- Row 1: get_balance FAIL -->
  <rect x="20" y="254" width="860" height="38" fill="#1a0a0a" rx="2"/>
  <text x="28" y="268" fill="#c9d1d9" font-size="11.5" font-family="monospace">get_balance</text>
  <rect x="168" y="257" width="68" height="18" rx="3" fill="#f85149" opacity="0.25"/>
  <text x="175" y="270" fill="#f85149" font-size="11.5" font-weight="bold">✗  FAIL</text>
  <text x="258" y="268" fill="#f8d365" font-size="11.5">Value/Unit</text>
  <text x="390" y="264" fill="#f85149" font-size="11" font-weight="bold">support-agent</text>
  <text x="390" y="280" fill="#f85149" font-size="10.5">CONFIRMED_REGRESSION</text>
  <text x="590" y="268" fill="#8b949e" font-size="10.5">100x scale shift: 1 250.0 → 125 000.0</text>
  <text x="590" y="282" fill="#6e7681" font-size="10">(INR → paise unit mismatch)</text>

  <!-- Row 2: search_products FAIL -->
  <rect x="20" y="296" width="860" height="52" fill="#1a0a0a" rx="2"/>
  <text x="28" y="313" fill="#c9d1d9" font-size="11.5" font-family="monospace">search_products</text>
  <rect x="168" y="299" width="68" height="18" rx="3" fill="#f85149" opacity="0.25"/>
  <text x="175" y="313" fill="#f85149" font-size="11.5" font-weight="bold">✗  FAIL</text>
  <text x="258" y="310" fill="#f8d365" font-size="11.5">Ordering</text>
  <text x="258" y="326" fill="#f8d365" font-size="11.5">Output</text>
  <text x="390" y="306" fill="#f85149" font-size="11" font-weight="bold">pricing-bot</text>
  <text x="390" y="320" fill="#f85149" font-size="10.5">CONFIRMED_REGRESSION</text>
  <text x="390" y="334" fill="#f85149" font-size="10.5">support-agent CONFIRMED_REGRESSION</text>
  <text x="590" y="310" fill="#8b949e" font-size="10.5">Array order reversed (Kendall τ = −1.00)</text>
  <text x="590" y="324" fill="#8b949e" font-size="10.5">Field missing: $.results[*].description</text>

  <!-- Separator -->
  <line x1="20" y1="358" x2="880" y2="358" stroke="#21262d" stroke-width="1"/>

  <!-- Summary -->
  <text x="20" y="380" fill="#c9d1d9" font-size="12.5" font-weight="bold">Summary</text>
  <text x="20" y="400" fill="#8b949e" font-size="11.5">Tools checked: 2    Regressions: 2    Consumers affected: 2 / 2</text>

  <!-- Consumer impact table -->
  <rect x="20" y="414" width="420" height="22" fill="#161b22" rx="3"/>
  <text x="28" y="429" fill="#8b949e" font-size="11" font-weight="bold">Agent</text>
  <text x="180" y="429" fill="#8b949e" font-size="11" font-weight="bold">Verdict</text>
  <text x="310" y="429" fill="#8b949e" font-size="11" font-weight="bold">Broken tools</text>

  <rect x="20" y="436" width="420" height="18" fill="#0d1117"/>
  <text x="28" y="449" fill="#c9d1d9" font-size="11">support-agent</text>
  <text x="180" y="449" fill="#f85149" font-size="11" font-weight="bold">CONFIRMED_REGRESSION</text>
  <text x="310" y="449" fill="#8b949e" font-size="11">get_balance, search_products</text>

  <rect x="20" y="454" width="420" height="18" fill="#161b22"/>
  <text x="28" y="467" fill="#c9d1d9" font-size="11">pricing-bot</text>
  <text x="180" y="467" fill="#f85149" font-size="11" font-weight="bold">CONFIRMED_REGRESSION</text>
  <text x="310" y="467" fill="#8b949e" font-size="11">search_products</text>

  <!-- Exit code -->
  <text x="20" y="498" fill="#f85149" font-size="12" font-weight="bold">✗  Exit 1  ·  CI gate FAILED  ·  2 behavioral regressions detected</text>
  <text x="558" y="498" fill="#58a6ff" font-size="11">regrip serve --port 8787 for dashboard ↗</text>
</svg>
