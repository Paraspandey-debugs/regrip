[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regrip"
version = "0.1.0"
description = "Catch breaking MCP tool changes before they break your agents. Records real calls, replays new server versions, and tells you which agent breaks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "starlette>=0.40",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
regrip = "regrip.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regrip = ["adapters/static/*", "bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
extra-standard-library = ["compression"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["regrip"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
