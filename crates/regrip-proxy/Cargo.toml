[package]
name = "regrip-proxy"
version = "0.1.0"
edition = "2021"
description = "High-speed MCP capture proxy and zeroizing pre-persistence PII/secret redactor"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
zstd = "0.13"
