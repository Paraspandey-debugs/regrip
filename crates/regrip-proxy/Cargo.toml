[package]
name = "regrip-proxy"
version = "0.1.0"
edition = "2021"
description = "High-speed MCP capture proxy and zeroizing pre-persistence PII/secret redactor"

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
zstd = "0.13"
